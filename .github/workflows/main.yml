name: Run Hybrid Trading Bot 5x Daily

on:
  schedule:
    # Central Standard Time (winter): 9:00, 10:30, 12:00, 13:30, 14:45 CT
    # During daylight saving time, move each UTC time one hour earlier.
    - cron: '0 15 * * 1-5'
    - cron: '30 16 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '30 19 * * 1-5'
    - cron: '45 20 * * 1-5'
  workflow_dispatch:

# Prevent overlapping evaluations if GitHub queues a delayed scheduled run.
concurrency:
  group: hybrid-trading-bot
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-dotenv

      - name: Run hybrid paper bot (paper orders enabled)
        env:
          GETRICH_API_KEY: ${{ secrets.GETRICH_API_KEY }}
          GETRICH_API_SECRET: ${{ secrets.GETRICH_API_SECRET }}
          GETRICH_BASE_URL: ${{ secrets.GETRICH_BASE_URL }}
          GETRICH_DATA_URL: ${{ secrets.GETRICH_DATA_URL }}
          ALPACA_DATA_FEED: iex
          EXECUTE_ORDERS: 'true'
        run: python ./project_hybrid.py
