
name: Daily MSFT Linear Regression

on:
  workflow_dispatch:

  schedule:
    - cron: "0 16 * * 1-5"

permissions:
  contents: write

concurrency:
  group: msft-paper-model
  cancel-in-progress: false

jobs:
  run-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required files
        run: |
          test -f linearregressionmodelcompletee.py
          test -f data/msft_2024_5min.csv
          echo "Required files found."

      - name: Run Linear Regression and Paper Trading
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED }}
          ENABLE_PAPER_TRADING: ${{ vars.ENABLE_PAPER_TRADING }}
        run: |
          python linearregressionmodelcompletee.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/msft_predictions.csv
          git add results/msft_paper_orders.csv

          if ! git diff --cached --quiet; then
            git commit -m "Update MSFT paper trading results"
            git push
          fi
