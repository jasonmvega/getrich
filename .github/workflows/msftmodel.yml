
name: Daily MSFT Linear Regression

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1-5"

permissions:
  contents: write

jobs:
  run-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository files
        run: |
          echo "CURRENT DIRECTORY:"
          pwd

          echo "ROOT FILES:"
          ls -la

          echo "PYTHON FILES:"
          find . -type f -name "*.py"

          echo "CHECKING MODEL:"
          if [ -f "linearregressionmodelcomplete.py" ]; then
            echo "SUCCESS: Model file found."
          else
            echo "ERROR: Model file not found in repository root."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn requests

      - name: Run Linear Regression
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED }}
        run: python linearregressionmodelcomplete.py

      - name: Save prediction results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/msft_predictions.csv

          if ! git diff --cached --quiet; then
            git commit -m "Daily MSFT model results"
            git push
          fi
