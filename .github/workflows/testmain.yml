name: Test Trading Bot

on:
  workflow_dispatch:

jobs:
  test-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv

      - name: Check Python syntax
        run: python -m py_compile project.py

      - name: Verify required secrets
        env:
          GETRICH_API_KEY: ${{ secrets.GETRICH_API_KEY }}
          GETRICH_API_SECRET: ${{ secrets.GETRICH_API_SECRET }}
        run: |
          python -c "import os; assert os.getenv('GETRICH_API_KEY'), 'Missing API key'; assert os.getenv('GETRICH_API_SECRET'), 'Missing API secret'; print('API credentials detected')"

      - name: Run trading bot
        env:
          GETRICH_API_KEY: ${{ secrets.GETRICH_API_KEY }}
          GETRICH_API_SECRET: ${{ secrets.GETRICH_API_SECRET }}
          GETRICH_BASE_URL: https://paper-api.alpaca.markets
          GETRICH_DATA_URL: https://data.alpaca.markets
          EXECUTE_ORDERS: "false"
        run: python -u project.py
